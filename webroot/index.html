<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sesh Helpers</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      max-width: 42rem;
      width: 100%;
    }

    .logo {
      width: min(90vw, 36rem);
      height: auto;
      display: block;
    }

    .tagline {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1.5;
      color: #e8e8e8;
      text-shadow:
        -1px 0 0 rgba(0, 255, 255, 0.45),
         1px 0 0 rgba(255, 0, 255, 0.45);
    }

    footer {
      margin-top: 3rem;
      font-size: 0.875rem;
      color: #666666;
    }

    footer a {
      color: #00ffff;
      text-decoration: none;
      text-shadow: 1px 0 0 rgba(255, 0, 255, 0.35);
      transition: color 0.15s ease;
    }

    footer a:hover {
      color: #ff00ff;
      text-shadow: -1px 0 0 rgba(0, 255, 255, 0.5);
    }
  </style>
</head>
<body>
  <main>
    <img
      class="logo"
      src="img/seshhelpers.png"
      alt="Sesh Helpers — glitch-styled logo with mascot"
      width="576"
      height="auto"
    >
    <p class="tagline">Helper apps for the Sesh Sofa show.</p>
  </main>
  <footer>
    <a href="../docs/README.md">Documentation</a>
  </footer>
</body>
</html>
