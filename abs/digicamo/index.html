<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Digicamo — ABS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../../ui/menu-picker.css" />
</head>
<body>
  <canvas id="digicamo-canvas" aria-hidden="true"></canvas>
  <div id="glow" aria-hidden="true"></div>
  <div id="vignette" aria-hidden="true"></div>

  <div id="settings-menu">
    <div class="menu-header">
      <h2>Digicamo</h2>
      <div class="menu-header-buttons">
        <button id="flip-side-button" aria-label="Move menu to other side">⇄</button>
        <button id="close-menu-button" aria-label="Close settings">✕</button>
      </div>
    </div>

    <p class="hint">Settings hidden: double-click to reopen. ABS backdrop — use Copy URL for OBS for clean output.</p>

    <div class="settings-section" data-section="pattern">
      <button id="pattern-toggle" class="setting-toggle" type="button" aria-expanded="true" aria-controls="pattern-controls" data-section-toggle><span class="section-toggle-icon" aria-hidden="true">⏷</span>Pattern</button>
      <div id="pattern-controls" class="section-panel">
        <div class="setting-group">
          <label id="palette-label"><span>Palette</span></label>
          <div class="menu-picker" id="palette-picker"></div>
        </div>
        <div class="setting-group">
          <div class="range-control">
            <div class="range-details">
              <div class="range-label-row">
                <label for="speed-slider"><span>Speed</span></label>
              </div>
              <div class="range-row">
                <input id="speed-slider" type="range" min="0" max="3" step="0.05" />
              </div>
            </div>
            <div class="range-meta">
              <button type="button" class="reset-param" data-reset="speed" aria-label="Reset speed" title="Reset speed">↺</button>
              <span class="value-label" id="speed-value"></span>
            </div>
          </div>
        </div>
        <div class="setting-group">
          <div class="range-control">
            <div class="range-details">
              <div class="range-label-row">
                <label for="cell-size-slider"><span>Cell size</span></label>
              </div>
              <div class="range-row">
                <input id="cell-size-slider" type="range" min="3" max="24" step="1" />
              </div>
            </div>
            <div class="range-meta">
              <button type="button" class="reset-param" data-reset="cellSize" aria-label="Reset cell size" title="Reset cell size">↺</button>
              <span class="value-label" id="cell-size-value"></span>
            </div>
          </div>
        </div>
        <div class="setting-group">
          <div class="range-control">
            <div class="range-details">
              <div class="range-label-row">
                <label for="fleck-slider"><span>Fleck rarity</span></label>
              </div>
              <div class="range-row">
                <input id="fleck-slider" type="range" min="0.90" max="0.995" step="0.005" />
              </div>
            </div>
            <div class="range-meta">
              <button type="button" class="reset-param" data-reset="fleck" aria-label="Reset fleck rarity" title="Reset fleck rarity">↺</button>
              <span class="value-label" id="fleck-value"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="settings-section" data-section="glitch">
      <button id="glitch-toggle" class="setting-toggle" type="button" aria-expanded="false" aria-controls="glitch-controls" data-section-toggle><span class="section-toggle-icon" aria-hidden="true">⏵</span>Glitch</button>
      <div id="glitch-controls" class="section-panel" hidden>
        <div class="setting-group">
          <div class="range-control">
            <div class="range-details">
              <div class="range-label-row">
                <label for="glitch-amount-slider"><span>Amount</span></label>
              </div>
              <div class="range-row">
                <input id="glitch-amount-slider" type="range" min="0" max="1" step="0.01" />
              </div>
            </div>
            <div class="range-meta">
              <button type="button" class="reset-param" data-reset="glitch" aria-label="Reset glitch amount" title="Reset glitch amount">↺</button>
              <span class="value-label" id="glitch-amount-value"></span>
            </div>
          </div>
        </div>
        <div class="setting-group">
          <div class="range-control">
            <div class="range-details">
              <div class="range-label-row">
                <label for="glitch-shift-slider"><span>Band shift</span></label>
              </div>
              <div class="range-row">
                <input id="glitch-shift-slider" type="range" min="0" max="1" step="0.01" />
              </div>
            </div>
            <div class="range-meta">
              <button type="button" class="reset-param" data-reset="glitchShift" aria-label="Reset band shift" title="Reset band shift">↺</button>
              <span class="value-label" id="glitch-shift-value"></span>
            </div>
          </div>
        </div>
        <div class="setting-group">
          <div class="range-control">
            <div class="range-details">
              <div class="range-label-row">
                <label for="glitch-chroma-slider"><span>Chroma</span></label>
              </div>
              <div class="range-row">
                <input id="glitch-chroma-slider" type="range" min="0" max="1" step="0.01" />
              </div>
            </div>
            <div class="range-meta">
              <button type="button" class="reset-param" data-reset="glitchChroma" aria-label="Reset chroma" title="Reset chroma">↺</button>
              <span class="value-label" id="glitch-chroma-value"></span>
            </div>
          </div>
        </div>
        <div class="setting-group">
          <div class="range-control">
            <div class="range-details">
              <div class="range-label-row">
                <label for="glitch-bulge-slider"><span>Bulge</span></label>
              </div>
              <div class="range-row">
                <input id="glitch-bulge-slider" type="range" min="0" max="1" step="0.01" />
              </div>
            </div>
            <div class="range-meta">
              <button type="button" class="reset-param" data-reset="glitchBulge" aria-label="Reset bulge" title="Reset bulge">↺</button>
              <span class="value-label" id="glitch-bulge-value"></span>
            </div>
          </div>
        </div>
        <div class="setting-group">
          <div class="range-control">
            <div class="range-details">
              <div class="range-label-row">
                <label for="glitch-rate-slider"><span>Rate</span></label>
              </div>
              <div class="range-row">
                <input id="glitch-rate-slider" type="range" min="0.5" max="8" step="0.1" />
              </div>
            </div>
            <div class="range-meta">
              <button type="button" class="reset-param" data-reset="glitchRate" aria-label="Reset glitch rate" title="Reset glitch rate">↺</button>
              <span class="value-label" id="glitch-rate-value"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="settings-section" data-section="display">
      <button id="display-toggle" class="setting-toggle" type="button" aria-expanded="false" aria-controls="display-controls" data-section-toggle><span class="section-toggle-icon" aria-hidden="true">⏵</span>Display</button>
      <div id="display-controls" class="section-panel" hidden>
        <div class="setting-group">
          <label class="switch-row">
            <input id="vignette-toggle" type="checkbox" />
            <span>Vignette</span>
          </label>
        </div>
        <div class="setting-group effect-control" id="vignette-strength-group">
          <div class="range-control">
            <div class="range-details">
              <div class="range-label-row">
                <label for="vignette-strength-slider"><span>Vignette strength</span></label>
              </div>
              <div class="range-row">
                <input id="vignette-strength-slider" type="range" min="0" max="100" step="1" />
              </div>
            </div>
            <div class="range-meta">
              <button type="button" class="reset-param" data-reset="vignetteStrength" aria-label="Reset vignette strength" title="Reset vignette strength">↺</button>
              <span class="value-label" id="vignette-strength-value"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <button id="reset-button" class="menu-action">Reset all</button>

    <div class="setting-group copy-row">
      <button id="copy-url-button" class="small-button menu-action">Copy URL</button>
      <button id="copy-url-obs-button" class="small-button menu-action">Copy URL for OBS</button>
    </div>
  </div>

  <script src="../glitch-post.js"></script>
  <script src="../../ui/menu-picker.js"></script>
  <script src="app.js"></script>
</body>
</html>
