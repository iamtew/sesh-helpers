<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABS — Animated Background Scene</title>
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/better-vcr">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      padding: 2.5rem 1.5rem 3rem;
      color: #e0fefe;
      font-family: "Better VCR", monospace;
      line-height: 1.6;
      background:
        radial-gradient(ellipse 70% 55% at 50% 28%, rgba(14, 34, 62, 0.45), transparent 65%),
        #060b14;
    }

    .page {
      max-width: 40rem;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    h1 {
      font-size: clamp(1.35rem, 3.5vw, 1.85rem);
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(0, 255, 255, 0.25);
    }

    .tagline {
      margin-top: 0.75rem;
      max-width: 28rem;
      margin-left: auto;
      margin-right: auto;
      font-size: clamp(0.85rem, 2.2vw, 1rem);
      letter-spacing: 0.05em;
      color: rgba(224, 254, 254, 0.7);
    }

    .apps {
      max-width: 22rem;
      margin: 0 auto;
      text-align: center;
    }

    .apps h2 {
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(170, 220, 255, 0.55);
      margin-bottom: 1rem;
    }

    .apps ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .apps a {
      display: block;
      padding: 1rem 1.35rem;
      text-decoration: none;
      letter-spacing: 0.05em;
      border: 1px solid rgba(170, 220, 255, 0.22);
      border-radius: 4px;
      background: linear-gradient(
        135deg,
        rgba(14, 34, 62, 0.78),
        rgba(48, 92, 144, 0.52)
      );
      backdrop-filter: blur(28px) saturate(140%);
      -webkit-backdrop-filter: blur(28px) saturate(140%);
      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;
    }

    .apps a:hover,
    .apps a:focus-visible {
      border-color: rgba(170, 220, 255, 0.45);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.28),
        0 12px 36px rgba(0, 0, 0, 0.35),
        0 0 24px rgba(0, 255, 255, 0.12);
      transform: translateY(-2px);
      outline: none;
    }

    .apps a .app-name {
      display: block;
      font-size: 1.05rem;
      color: #e0fefe;
    }

    .apps a .app-desc {
      display: block;
      margin-top: 0.3rem;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      color: rgba(224, 254, 254, 0.55);
    }

    footer {
      margin-top: 2.75rem;
      text-align: center;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
    }

    footer a {
      color: rgba(170, 220, 255, 0.7);
      text-decoration: none;
    }

    footer a:hover,
    footer a:focus-visible {
      color: #e0fefe;
      text-shadow: 0 0 12px rgba(0, 255, 255, 0.35);
      outline: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .apps a {
        transition: none;
      }

      .apps a:hover,
      .apps a:focus-visible {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>ABS</h1>
      <p class="tagline">Animated Background Scene — full-screen OBS backdrop animations.</p>
    </header>

    <section class="apps" aria-label="ABS apps">
      <h2>Apps</h2>
      <ul>
        <li>
          <a href="diamond/">
            <span class="app-name">Diamond</span>
            <span class="app-desc">LCD geometric diamond lattice</span>
          </a>
        </li>
        <li>
          <a href="ripple/">
            <span class="app-name">Ripple</span>
            <span class="app-desc">Pulsing pixel wave backdrop</span>
          </a>
        </li>
        <li>
          <a href="voroni/">
            <span class="app-name">Voroni</span>
            <span class="app-desc">Voronoi pulse field with edge ripples</span>
          </a>
        </li>
        <li>
          <a href="coderain/">
            <span class="app-name">Code Rain</span>
            <span class="app-desc">Matrix code rain with optional overlay mode</span>
          </a>
        </li>
      </ul>
    </section>

    <footer>
      <a href="../">← Sesh Helpers</a>
    </footer>
  </div>
</body>
</html>
