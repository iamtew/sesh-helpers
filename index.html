<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sesh Helpers</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #e8e8e8;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 100vh;
      padding: 2rem 1.5rem 3rem;
      line-height: 1.6;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .logo {
      width: min(90vw, 36rem);
      height: auto;
      display: block;
    }

    .tagline {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      letter-spacing: 0.04em;
      text-shadow:
        -1px 0 0 rgba(0, 255, 255, 0.45),
         1px 0 0 rgba(255, 0, 255, 0.45);
    }

    .projects {
      max-width: 28rem;
      margin: 0 auto;
      text-align: center;
    }

    .projects h2 {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #666666;
      margin-bottom: 1rem;
    }

    .projects ul {
      list-style: none;
    }

    .projects a {
      display: block;
      padding: 0.85rem 1.25rem;
      border: 1px solid rgba(0, 255, 255, 0.35);
      color: #00ffff;
      text-decoration: none;
      text-shadow: 1px 0 0 rgba(255, 0, 255, 0.25);
      letter-spacing: 0.04em;
      transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .projects a:hover {
      color: #ff00ff;
      border-color: #ff00ff;
      background: rgba(255, 0, 255, 0.08);
      text-shadow: -1px 0 0 rgba(0, 255, 255, 0.4);
    }

    .projects a span {
      display: block;
      margin-top: 0.25rem;
      font-size: 0.8rem;
      color: #888888;
      text-shadow: none;
    }

    footer {
      margin-top: 3rem;
      text-align: center;
      font-size: 0.875rem;
      color: #666666;
    }

    footer a {
      color: #00ffff;
      text-decoration: none;
    }

    footer a:hover {
      color: #ff00ff;
    }
  </style>
</head>
<body>
  <header class="hero">
    <img
      class="logo"
      src="img/seshhelpers.png"
      alt="Sesh Helpers — glitch-styled logo with mascot"
      width="576"
    >
    <p class="tagline">Helper apps for the Sesh Sofa show.</p>
  </header>

  <section class="projects" aria-label="Projects">
    <h2>Projects</h2>
    <ul>
      <li>
        <a href="spotsmoke/">
          Spot Smoke
          <span>OBS smoke emitter</span>
        </a>
      </li>
      <li>
        <a href="seshbanner/">
          Sesh Banner
          <span>OBS title / message banner</span>
        </a>
      </li>
    </ul>
  </section>

  <footer>
    <a href="docs/README.md">Documentation</a>
  </footer>
</body>
</html>
