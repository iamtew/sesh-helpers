<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sesh Helpers</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: #000000;
      color: #e8e8e8;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 100vh;
      padding: 2rem 1.5rem 3rem;
      line-height: 1.6;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .logo {
      width: min(90vw, 36rem);
      height: auto;
      display: block;
    }

    .tagline {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      letter-spacing: 0.04em;
      text-shadow:
        -1px 0 0 rgba(0, 255, 255, 0.45),
         1px 0 0 rgba(255, 0, 255, 0.45);
    }

    .readme {
      max-width: 42rem;
      margin: 0 auto;
      text-align: left;
    }

    .readme h1 {
      display: none;
    }

    .readme h2 {
      margin: 2rem 0 0.75rem;
      font-size: 1.25rem;
      color: #ffffff;
      text-shadow: -1px 0 0 rgba(0, 255, 255, 0.3);
    }

    .readme h2:first-child {
      margin-top: 0;
    }

    .readme p {
      margin: 0.75rem 0;
      color: #cccccc;
    }

    .readme blockquote {
      margin: 1rem 0;
      padding: 0.75rem 1rem;
      border-left: 3px solid #ff00ff;
      background: rgba(255, 0, 255, 0.08);
      color: #bbbbbb;
    }

    .readme a {
      color: #00ffff;
      text-decoration: none;
      text-shadow: 1px 0 0 rgba(255, 0, 255, 0.25);
    }

    .readme a:hover {
      color: #ff00ff;
      text-shadow: -1px 0 0 rgba(0, 255, 255, 0.4);
    }

    .readme ul {
      margin: 0.75rem 0;
      padding-left: 1.5rem;
      color: #cccccc;
    }

    .readme li {
      margin: 0.25rem 0;
    }

    .readme .loading,
    .readme .error {
      text-align: center;
      color: #666666;
      font-size: 0.875rem;
    }

    .readme .error {
      color: #ff6666;
    }

    footer {
      margin-top: 3rem;
      text-align: center;
      font-size: 0.875rem;
      color: #666666;
    }

    footer a {
      color: #00ffff;
      text-decoration: none;
    }

    footer a:hover {
      color: #ff00ff;
    }
  </style>
</head>
<body>
  <header class="hero">
    <img
      class="logo"
      src="img/seshhelpers.png"
      alt="Sesh Helpers — glitch-styled logo with mascot"
      width="576"
    >
    <p class="tagline">Helper apps for the Sesh Sofa show.</p>
  </header>

  <article id="readme" class="readme">
    <p class="loading">Loading README…</p>
  </article>

  <footer>
    <a href="docs/README.md">Documentation</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    marked.setOptions({ gfm: true, breaks: false });

    const readmeEl = document.getElementById('readme');

    fetch('README.md')
      .then(function (response) {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.text();
      })
      .then(function (markdown) {
        readmeEl.innerHTML = marked.parse(markdown);
      })
      .catch(function () {
        readmeEl.innerHTML =
          '<p class="error">Could not load README.md. Serve this repo over HTTP (e.g. GitHub Pages) rather than opening the file directly.</p>';
      });
  </script>
</body>
</html>
