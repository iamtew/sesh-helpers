<!DOCTYPE html>
<html lang="en" data-theme="lcd-glass">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentation — Sesh Helpers</title>
  <link rel="stylesheet" href="../vendor/fonts/ui.css">
  <link rel="stylesheet" href="../vendor/tabler-icons/tabler-icons.min.css">
  <link rel="stylesheet" href="../themes/lcd-glass/theme.css">
  <link rel="stylesheet" href="../themes/sesh-glass/theme.css">
  <link rel="stylesheet" href="../themes/sesh-glass-old/theme.css">
  <link rel="stylesheet" href="../themes/3026-d3c0/theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top-bar theme-panel">
    <a class="home-link" href="../">← Sesh Helpers</a>
    <h1 class="page-title">Documentation</h1>
    <a
      id="github-link"
      class="github-link"
      href="https://github.com/iamtew/sesh-helpers/tree/master/docs"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="github-icon ti ti-brand-github" aria-hidden="true"></span>
      <span>View on GitHub</span>
    </a>
    <div class="theme-control">
      <label for="theme-select">Theme</label>
      <select id="theme-select" aria-label="Theme"></select>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-panel chrome-panel">
        <div class="sidebar-tabs" role="tablist" aria-label="Sidebar">
          <button
            type="button"
            id="tab-files"
            class="sidebar-tab"
            role="tab"
            aria-selected="true"
            aria-controls="panel-files"
          >Files</button>
          <button
            type="button"
            id="tab-contents"
            class="sidebar-tab"
            role="tab"
            aria-selected="false"
            aria-controls="panel-contents"
            tabindex="-1"
          >Contents</button>
        </div>
        <div
          id="panel-files"
          class="sidebar-tab-panel"
          role="tabpanel"
          aria-labelledby="tab-files"
        >
          <ul id="file-list" class="file-tree"></ul>
        </div>
        <div
          id="panel-contents"
          class="sidebar-tab-panel toc"
          role="tabpanel"
          aria-labelledby="tab-contents"
          hidden
        >
          <p id="toc-empty" class="toc-empty">No headings in this document.</p>
          <ol id="toc-list"></ol>
        </div>
      </div>
    </aside>

    <main class="doc-main">
      <div class="doc-shell">
        <div class="doc-shell-bg" aria-hidden="true"></div>
        <header class="doc-header">
          <div class="doc-header-row">
            <h2 id="doc-title" class="doc-title">…</h2>
            <a
              id="github-file-link"
              class="github-file-link"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
            >Open in GitHub ↗</a>
          </div>
          <p id="doc-stats" class="doc-stats" aria-live="polite"></p>
        </header>
        <article id="doc-content" class="doc-content">
          <p class="loading">Loading…</p>
        </article>
      </div>
    </main>
  </div>

  <script src="../vendor/marked/marked.min.js"></script>
  <script src="../vendor/pixi/pixi.min.js"></script>
  <script src="../themes/lcd-glass/theme.js"></script>
  <script src="../themes/sesh-glass/theme.js"></script>
  <script src="../themes/sesh-glass-old/theme.js"></script>
  <script src="../themes/3026-d3c0/theme.js"></script>
  <script src="app.js"></script>
</body>
</html>
